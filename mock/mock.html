<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Lumi;src:url(../vendor/lumi.woff) format('woff');font-weight:800}
html,body{margin:0;background:#000}
canvas{display:block}
</style></head>
<body><canvas id="c"></canvas>
<script>
const Q = new URLSearchParams(location.search);
const MODE = Q.get('mode') || 'portrait';      // portrait | landscape | palette | over
const W = +(Q.get('w') || 390), H = +(Q.get('h') || 844), DPR = 2;
const cv = document.getElementById('c'); cv.width = W * DPR; cv.height = H * DPR; cv.style.width = W + 'px'; cv.style.height = H + 'px';
const g = cv.getContext('2d'); g.scale(DPR, DPR);
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

const COLORS = [
  { base: '#ff5d73', hi: '#ffd0d7', lo: '#a3123a', name: 'Коралл' },
  { base: '#ffb43d', hi: '#fff0c4', lo: '#a85a00', name: 'Янтарь' },
  { base: '#5fe39a', hi: '#d8ffe8', lo: '#0f7a4a', name: 'Мята' },
  { base: '#44d2ff', hi: '#d6f6ff', lo: '#0a6c9c', name: 'Лёд' },
  { base: '#a77bff', hi: '#e9dcff', lo: '#4b23b0', name: 'Аметист' },
  { base: '#ff79d0', hi: '#ffe0f4', lo: '#a01a78', name: 'Фуксия' },
];
const GLYPH = ['dot', 'star', 'tri', 'diamond', 'ring', 'plus'];

function bg() {
  const gr = g.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, '#0a0b24'); gr.addColorStop(0.55, '#1a1145'); gr.addColorStop(1, '#2b0f45');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  const blobs = [[0.15, 0.2, 0.55, '#3b2bbd'], [0.85, 0.45, 0.6, '#7a1f8f'], [0.4, 0.9, 0.7, '#1b5aa8']];
  g.globalCompositeOperation = 'lighter';
  for (const [x, y, r, c] of blobs) {
    const rr = r * Math.max(W, H) * 0.6;
    const rg = g.createRadialGradient(x * W, y * H, 0, x * W, y * H, rr);
    rg.addColorStop(0, c + '55'); rg.addColorStop(1, c + '00');
    g.fillStyle = rg; g.fillRect(0, 0, W, H);
  }
  for (let i = 0; i < 70; i++) {
    const x = rnd() * W, y = rnd() * H, r = 1 + rnd() * (i < 12 ? 14 : 3);
    const rg = g.createRadialGradient(x, y, 0, x, y, r);
    const a = i < 12 ? 0.10 : 0.5 * rnd();
    rg.addColorStop(0, `rgba(200,190,255,${a})`); rg.addColorStop(1, 'rgba(200,190,255,0)');
    g.fillStyle = rg; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
  g.globalCompositeOperation = 'source-over';
}

function glyph(type, x, y, r) {
  g.save(); g.translate(x, y); g.fillStyle = 'rgba(255,255,255,.62)'; g.strokeStyle = 'rgba(255,255,255,.62)'; g.lineWidth = r * 0.16;
  const s = r * 0.42;
  g.beginPath();
  if (type === 'dot') { g.arc(0, 0, s * 0.55, 0, 7); g.fill(); }
  else if (type === 'ring') { g.arc(0, 0, s * 0.7, 0, 7); g.stroke(); }
  else if (type === 'tri') { g.moveTo(0, -s); g.lineTo(s * 0.9, s * 0.62); g.lineTo(-s * 0.9, s * 0.62); g.closePath(); g.fill(); }
  else if (type === 'diamond') { g.moveTo(0, -s); g.lineTo(s * 0.75, 0); g.lineTo(0, s); g.lineTo(-s * 0.75, 0); g.closePath(); g.fill(); }
  else if (type === 'plus') { const w = s * 0.34; g.rect(-w, -s * 0.85, w * 2, s * 1.7); g.rect(-s * 0.85, -w, s * 1.7, w * 2); g.fill(); }
  else if (type === 'star') { for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? s * 0.45 : s; g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } g.closePath(); g.fill(); }
  g.restore();
}

function orb(x, y, r, ci, opts = {}) {
  const C = COLORS[ci] || { base: '#ffffff', hi: '#ffffff', lo: '#888' };
  // halo
  g.globalCompositeOperation = 'lighter';
  const hr = r * (opts.glow || 2.1);
  const hg = g.createRadialGradient(x, y, r * 0.4, x, y, hr);
  hg.addColorStop(0, C.base + (opts.bright ? 'aa' : '66')); hg.addColorStop(1, C.base + '00');
  g.fillStyle = hg; g.beginPath(); g.arc(x, y, hr, 0, 7); g.fill();
  g.globalCompositeOperation = 'source-over';
  if (opts.rainbow) {
    const cg = g.createConicGradient(0, x, y);
    ['#ff5d73', '#ffb43d', '#5fe39a', '#44d2ff', '#a77bff', '#ff79d0', '#ff5d73'].forEach((c, i) => cg.addColorStop(i / 6, c));
    g.fillStyle = cg; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  } else if (opts.nova) {
    const ng = g.createRadialGradient(x, y, 0, x, y, r);
    ng.addColorStop(0, '#ffffff'); ng.addColorStop(0.45, '#fff2b0'); ng.addColorStop(1, '#ff9a2e');
    g.fillStyle = ng; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  } else {
    const sg = g.createRadialGradient(x - r * 0.3, y - r * 0.35, r * 0.1, x, y, r);
    sg.addColorStop(0, C.hi); sg.addColorStop(0.42, C.base); sg.addColorStop(1, C.lo);
    g.fillStyle = sg; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
  // rim + specular
  g.strokeStyle = 'rgba(255,255,255,.18)'; g.lineWidth = Math.max(1, r * 0.06); g.beginPath(); g.arc(x, y, r * 0.96, 0, 7); g.stroke();
  const sp = g.createRadialGradient(x - r * 0.38, y - r * 0.42, 0, x - r * 0.38, y - r * 0.42, r * 0.42);
  sp.addColorStop(0, 'rgba(255,255,255,.85)'); sp.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = sp; g.beginPath(); g.arc(x - r * 0.38, y - r * 0.42, r * 0.42, 0, 7); g.fill();
  if (opts.nova) { g.save(); g.translate(x, y); g.fillStyle = '#fff'; g.beginPath(); for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, rr = i % 2 ? r * 0.18 : r * 0.62; g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } g.closePath(); g.globalAlpha = .9; g.fill(); g.restore(); }
  else if (!opts.rainbow && opts.glyph !== false) glyph(GLYPH[ci], x, y, r);
}

function spark(x, y, c, n, spread) {
  g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < n; i++) {
    const a = rnd() * 6.28, d = rnd() * spread, px = x + Math.cos(a) * d, py = y + Math.sin(a) * d, r = 1 + rnd() * 3.2;
    const rg = g.createRadialGradient(px, py, 0, px, py, r * 2.6);
    rg.addColorStop(0, '#ffffff'); rg.addColorStop(0.3, c); rg.addColorStop(1, c + '00');
    g.fillStyle = rg; g.beginPath(); g.arc(px, py, r * 2.6, 0, 7); g.fill();
  }
  g.globalCompositeOperation = 'source-over';
}
function ringwave(x, y, r, c, a) { g.globalCompositeOperation = 'lighter'; g.strokeStyle = c; g.globalAlpha = a; g.lineWidth = 2.5; g.beginPath(); g.arc(x, y, r, 0, 7); g.stroke(); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; }

function text(t, x, y, size, color, align = 'left', alpha = 1, ls = 0) {
  g.font = `800 ${size}px Lumi, sans-serif`; g.textAlign = align; g.textBaseline = 'middle'; g.fillStyle = color; g.globalAlpha = alpha;
  if ('letterSpacing' in g) g.letterSpacing = ls + 'px';
  g.fillText(t, x, y); g.globalAlpha = 1; if ('letterSpacing' in g) g.letterSpacing = '0px';
}
function rrect(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function iconBtn(x, y, r, draw) {
  g.fillStyle = 'rgba(255,255,255,.08)'; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  g.strokeStyle = 'rgba(255,255,255,.16)'; g.lineWidth = 1.2; g.stroke();
  g.save(); g.translate(x, y); g.strokeStyle = '#e9e4ff'; g.fillStyle = '#e9e4ff'; g.lineWidth = 2.2; g.lineCap = 'round'; draw(); g.restore();
}
const pauseIcon = () => { g.beginPath(); g.moveTo(-4, -7); g.lineTo(-4, 7); g.moveTo(4, -7); g.lineTo(4, 7); g.stroke(); };
const soundIcon = () => { g.beginPath(); g.moveTo(-8, -3); g.lineTo(-4, -3); g.lineTo(1, -8); g.lineTo(1, 8); g.lineTo(-4, 3); g.lineTo(-8, 3); g.closePath(); g.fill(); g.beginPath(); g.arc(2, 0, 6, -0.9, 0.9); g.stroke(); };

// ---- board -------------------------------------------------------------
const BOARD = [
  '00113344225',
  '0113344225',
  '50133442251',
  '5533442211',
  '55234411100',
  '2223441003',
  '22.334.0033',
  '.2..3...03',
  '...........',
];
function drawField(fx, fy, u, opts = {}) {
  const FW = 22, ROWH = Math.sqrt(3), DEAD = 12, SHY = 25.2, FH = 28;
  const X = (x) => fx + x * u, Y = (y) => fy + y * u;
  // glass panel
  g.fillStyle = 'rgba(255,255,255,.035)'; rrect(X(-0.5), Y(-0.5), (FW + 1) * u, (FH + 0.3) * u, u * 1.2); g.fill();
  g.strokeStyle = 'rgba(190,175,255,.16)'; g.lineWidth = 1.2; g.stroke();
  // deadline
  const dy = Y(1 + DEAD * ROWH - 1);
  g.setLineDash([u * 0.7, u * 0.55]); g.strokeStyle = 'rgba(255,110,150,.5)'; g.lineWidth = 2; g.beginPath(); g.moveTo(X(0.2), dy); g.lineTo(X(FW - 0.2), dy); g.stroke(); g.setLineDash([]);
  const dg = g.createLinearGradient(0, dy - u * 1.6, 0, dy); dg.addColorStop(0, 'rgba(255,90,140,0)'); dg.addColorStop(1, 'rgba(255,90,140,.10)'); g.fillStyle = dg; g.fillRect(X(0), dy - u * 1.6, FW * u, u * 1.6);
  // orbs
  const cells = [];
  BOARD.forEach((row, r) => { const sh = r % 2 === 1; [...row].forEach((ch, c) => { if (ch === '.') return; cells.push([1 + (sh ? 1 : 0) + c * 2, 1 + r * ROWH, +ch]); }); });
  for (const [x, y, ci] of cells) orb(X(x), Y(y), u * 0.98, ci);
  // aim line
  const sx = 11, sy = SHY;
  let ax = sx, ay = sy, dx = -0.42, dyy = -0.91, n = 0;
  const L = Math.hypot(dx, dyy); dx /= L; dyy /= L;
  for (let s = 0; s < 120; s++) {
    ax += dx * 0.25; ay += dyy * 0.25; if (ax < 1) { ax = 2 - ax; dx = -dx; }
    if (ay < 1 + 7 * ROWH + 0.6) break;
    if (s % 4 === 3) { n++; g.globalCompositeOperation = 'lighter'; g.fillStyle = `rgba(68,210,255,${Math.max(0.15, 0.9 - n * 0.035)})`; g.beginPath(); g.arc(X(ax), Y(ay), u * (0.2 - n * 0.003), 0, 7); g.fill(); g.globalCompositeOperation = 'source-over'; }
  }
  // ghost
  g.strokeStyle = 'rgba(68,210,255,.75)'; g.setLineDash([u * 0.35, u * 0.3]); g.lineWidth = 1.6; g.beginPath(); g.arc(X(ax), Y(1 + 7 * ROWH), u * 0.95, 0, 7); g.stroke(); g.setLineDash([]);
  // pop burst
  if (opts.burst !== false) {
    const bx = X(14), by = Y(1 + 6 * ROWH);
    ringwave(bx, by, u * 2.3, '#a77bff', .55); ringwave(bx, by, u * 3.4, '#a77bff', .22);
    spark(bx, by, '#a77bff', 26, u * 3.2);
    text('+90', bx + u * 1.5, by - u * 2.2, u * 1.25, '#efe6ff', 'left', .95);
    // falling orbs
    orb(X(17.3), Y(19.8), u * 0.9, 0, { glyph: true }); orb(X(19.6), Y(23.2), u * 0.85, 0);
    g.globalAlpha = 1;
  }
  // shooter
  const SX = X(sx), SY = Y(sy);
  g.globalCompositeOperation = 'lighter';
  const pg = g.createRadialGradient(SX, SY, u, SX, SY, u * 3.4); pg.addColorStop(0, 'rgba(68,210,255,.35)'); pg.addColorStop(1, 'rgba(68,210,255,0)');
  g.fillStyle = pg; g.beginPath(); g.arc(SX, SY, u * 3.4, 0, 7); g.fill(); g.globalCompositeOperation = 'source-over';
  g.strokeStyle = 'rgba(255,255,255,.14)'; g.lineWidth = u * 0.28; g.beginPath(); g.arc(SX, SY, u * 1.75, 0, 7); g.stroke();
  g.strokeStyle = '#ffcc4d'; g.lineCap = 'round'; g.beginPath(); g.arc(SX, SY, u * 1.75, -Math.PI / 2, -Math.PI / 2 + 6.28 * 0.68); g.stroke(); g.lineCap = 'butt';
  orb(SX, SY, u * 1.05, 3, { bright: true });
  // next orb + swap
  orb(X(sx - 4.4), Y(sy + 0.8), u * 0.72, 1);
  g.strokeStyle = 'rgba(233,228,255,.55)'; g.lineWidth = 1.6; g.beginPath(); g.arc(X(sx - 2.25), Y(sy + 0.5), u * 0.9, 3.6, 5.6); g.stroke();
  // rainbow rewarded button
  const RX = X(sx + 4.4), RY = Y(sy + 0.8);
  orb(RX, RY, u * 0.72, -1, { rainbow: true });
  g.fillStyle = '#ffcc4d'; rrect(RX + u * 0.2, RY - u * 1.5, u * 1.5, u * 0.95, u * 0.45); g.fill();
  g.fillStyle = '#2a1a00'; g.beginPath(); g.moveTo(RX + u * 0.75, RY - u * 1.28); g.lineTo(RX + u * 1.2, RY - u * 1.03); g.lineTo(RX + u * 0.75, RY - u * 0.78); g.fill();
  // misses dots
  for (let i = 0; i < 5; i++) { g.fillStyle = i < 3 ? 'rgba(233,228,255,.85)' : 'rgba(233,228,255,.18)'; g.beginPath(); g.arc(SX - u * 1.6 + i * u * 0.8, SY + u * 2.55, u * 0.17, 0, 7); g.fill(); }
  return { X, Y, u };
}

function hud(x, y, w, compact) {
  text(compact ? 'СЧЁТ' : 'СЧЁТ', x, y, 11, '#b9b0e6', 'left', 1, 1.5);
  text('12 480', x, y + 24, compact ? 30 : 34, '#ffffff');
  text('Рекорд  18 220', x, y + 52, 12, '#b9b0e6');
  iconBtn(x + w - 22, y + 22, 22, pauseIcon);
  iconBtn(x + w - 72, y + 22, 22, soundIcon);
}

function combo(cx, cy, s) {
  g.save(); g.translate(cx, cy); g.rotate(-0.06);
  g.globalCompositeOperation = 'lighter';
  const cg = g.createRadialGradient(0, 0, 0, 0, 0, s * 3.2); cg.addColorStop(0, 'rgba(255,190,80,.35)'); cg.addColorStop(1, 'rgba(255,190,80,0)');
  g.fillStyle = cg; g.beginPath(); g.arc(0, 0, s * 3.2, 0, 7); g.fill(); g.globalCompositeOperation = 'source-over';
  text('КОМБО ×3', 0, 0, s, '#ffd36b', 'center', 1, 1);
  g.restore();
}

document.fonts.load('800 20px Lumi').then(() => {
  if (MODE === 'portrait') {
    bg();
    const u = (W - 24) / 23; const fy = 104 + Math.max(0, (H - 104 - 28.6 * u - 30) / 2);
    hud(18, 26, W - 36);
    drawField(12 + u * 0.5, fy, u);
    combo(W * 0.5, fy + u * 17, 26);
  } else if (MODE === 'landscape') {
    bg();
    const u = (H - 40) / 28.6; const FWpx = 23 * u; const fx = (W - FWpx) / 2 + u * 0.5;
    drawField(fx, 26, u);
    // side HUD
    text('LUMI POP', 60, 70, 34, '#ffffff', 'left', 1, 2);
    text('СЧЁТ', 60, 140, 12, '#b9b0e6', 'left', 1, 1.5); text('12 480', 60, 172, 44, '#ffffff');
    text('Рекорд  18 220', 60, 214, 14, '#b9b0e6');
    text('СВЕРХНОВАЯ', 60, 290, 12, '#b9b0e6', 'left', 1, 1.5);
    g.fillStyle = 'rgba(255,255,255,.1)'; rrect(60, 306, 220, 10, 5); g.fill(); g.fillStyle = '#ffcc4d'; rrect(60, 306, 150, 10, 5); g.fill();
    text('Тяни — целься, отпусти — стреляй', 60, H - 60, 14, '#8f86c4');
    iconBtn(W - 50, 50, 24, pauseIcon); iconBtn(W - 104, 50, 24, soundIcon);
    combo(W / 2, 26 + u * 17, 30);
  } else if (MODE === 'over') {
    bg(); const u = (W - 24) / 23; drawField(12 + u * 0.5, 104 + Math.max(0, (H - 104 - 28.6 * u - 30) / 2), u, { burst: false }); hud(18, 26, W - 36);
    g.fillStyle = 'rgba(6,5,20,.72)'; g.fillRect(0, 0, W, H);
    const cw = W - 56, cx = 28, cy = H * 0.24, ch = 400;
    const cg = g.createLinearGradient(0, cy, 0, cy + ch); cg.addColorStop(0, '#231b5c'); cg.addColorStop(1, '#170f3c');
    g.fillStyle = cg; rrect(cx, cy, cw, ch, 26); g.fill(); g.strokeStyle = 'rgba(190,175,255,.22)'; g.lineWidth = 1.2; g.stroke();
    text('НОВЫЙ РЕКОРД', W / 2, cy + 48, 13, '#ffd36b', 'center', 1, 2);
    text('21 640', W / 2, cy + 104, 56, '#ffffff', 'center');
    text('Лучший: 21 640', W / 2, cy + 152, 14, '#b9b0e6', 'center');
    orb(W / 2, cy + 206, 22, 4); orb(W / 2 - 46, cy + 214, 14, 1); orb(W / 2 + 46, cy + 214, 14, 3);
    g.fillStyle = '#ffcc4d'; rrect(cx + 24, cy + 258, cw - 48, 56, 18); g.fill();
    g.fillStyle = '#2a1a00'; g.beginPath(); g.moveTo(cx + 54, cy + 274); g.lineTo(cx + 70, cy + 286); g.lineTo(cx + 54, cy + 298); g.fill();
    text('Продолжить', W / 2 + 8, cy + 280, 19, '#2a1a00', 'center'); text('за просмотр рекламы', W / 2 + 8, cy + 300, 11, '#6a4a00', 'center');
    g.fillStyle = 'rgba(255,255,255,.1)'; rrect(cx + 24, cy + 326, cw - 48, 52, 18); g.fill();
    text('Ещё раз', W / 2, cy + 352, 18, '#ffffff', 'center');
  } else if (MODE === 'palette') {
    g.fillStyle = '#120d33'; g.fillRect(0, 0, W, H);
    const step = W / 8;
    COLORS.forEach((c, i) => { orb(step * (i + 1), H * 0.42, 40, i); text(c.name, step * (i + 1), H * 0.42 + 78, 15, '#d8d2ff', 'center'); });
    orb(step * 7, H * 0.42, 40, -1, { rainbow: true }); text('Радуга', step * 7, H * 0.42 + 78, 15, '#d8d2ff', 'center');
  } else if (MODE === 'nova') {
    g.fillStyle = '#120d33'; g.fillRect(0, 0, W, H);
    orb(W / 2, H / 2, 52, -1, { nova: true, glow: 3.4, bright: true });
    spark(W / 2, H / 2, '#ffcc4d', 30, 140); ringwave(W / 2, H / 2, 110, '#ffcc4d', .5); ringwave(W / 2, H / 2, 160, '#ffcc4d', .2);
  }
  document.title = 'done';
});
</script></body></html>
